server:
  port: 8002

spring:
  application:
    name: api-gateway
  r2dbc:
    url: ${MYSQL_R2DBC_URL:r2dbc:mysql://localhost:3307/digital_cs?useServerPrepareStatement=true}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ORIGIN:http://localhost:5173}
              - ${FRONTEND_ORIGIN_ALT:http://127.0.0.1:5173}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: agent-stream
          uri: ${AGENT_SERVICE_URI:http://127.0.0.1:8001}
          predicates:
            - Path=/api/agent/stream
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: agent-service
          uri: ${AGENT_SERVICE_URI:http://127.0.0.1:8001}
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: customer-service
          uri: ${MCP_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/customer/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
      httpclient:
        connect-timeout: 5000
        response-timeout: 300s

gateway:
  jwt:
    # HS256 签名密钥，长度需 >= 32 字节；默认不提供，启动时校验必须由环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:}
    ttl: 2h
    issuer: api-gateway
  memory:
    # Agent 记忆最终记录使用 spring.r2dbc 指向的 MySQL；
    # Qdrant 由 Python Agent 侧用于记忆快照和长期语义召回。
  security:
    require-env-jwt-secret: ${REQUIRE_ENV_JWT_SECRET:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.digitalmall.gateway: INFO
    org.springframework.cloud.gateway: INFO
