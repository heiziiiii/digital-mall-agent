<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阿数 · AI 智能客服</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #f4f5fb;
        color: #1c1b22;
        font-family: 'Sora', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100%;
      }
      .fallback-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(91, 84, 232, 0.14), transparent 60%),
          linear-gradient(180deg, #fff 0%, #f4f5fb 100%);
      }
      .fallback-mark {
        width: 60px;
        height: 60px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #6d6bf5, #4f46e5);
        color: #fff;
        font-weight: 800;
        font-size: 26px;
        box-shadow: 0 14px 30px -10px rgba(79, 70, 229, 0.6);
      }
      .fallback-copy h1 {
        margin: 0;
        font-weight: 700;
        font-size: clamp(26px, 4vw, 40px);
        line-height: 1.2;
      }
      .fallback-kicker {
        margin: 0 0 10px;
        color: #4f46e5;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }
      .fallback-copy p:last-child {
        margin: 16px auto 0;
        max-width: 42ch;
        color: #6b6770;
        line-height: 1.7;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fallback-shell">
        <div class="fallback-mark">数</div>
        <div class="fallback-copy">
          <p class="fallback-kicker">阿数 · AI 智能客服</p>
          <h1>推荐、订单、售后、人工、技术支持，一个对话窗全搞定。</h1>
          <p>如果你直接打开了这个页面，请通过 Vite 开发服务访问，或等待前端脚本挂载后查看完整界面。</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
